[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd--api"
version = "0.1.0"
description = "实论产品门面服务端：论文检索/公文写作（shilun）或剧本创作与 AI 底料（juchuang）。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "uvicorn",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 显式列包（setuptools 自动发现会把 data/ 误判为顶层包，见 commit 08378c7）。
# 新增子包必须在此登记，否则镜像里 pip install . 装不上。
[tool.setuptools]
packages = [
    "fd_shilun_api",
    "fd_shilun_api.verify",
    "fd_shilun_api.gongwen",
    "fd_shilun_api.proofread",
]

[tool.setuptools.package-data]
"fd_shilun_api.proofread" = ["*.json"]
