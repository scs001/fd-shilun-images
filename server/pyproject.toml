[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd--api"
version = "0.1.0"
description = "实论产品门面服务端：论文检索/公文写作（shilun）或剧本创作与 AI 底料（juchuang）。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["fd_shilun_api"]
