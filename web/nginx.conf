server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点（不经缓存）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 工作台 API 反代：同源调 /api/，上游 fd-prod 集群内 fd--api
    location /api/ {
        proxy_pass http://fd-shilun-api.fd-prod.svc.cluster.local:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退：/ /workbench /admin 全部落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
